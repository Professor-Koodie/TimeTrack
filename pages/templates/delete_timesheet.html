{% extends "home.html" %}

{% block title %}Delete Timesheet{% endblock %}

{% block content %}
<h1>Delete Timesheet</h1>
<p>Are you sure you want to delete "{{ object.employee }} - {{ object.hours_week }} hours/week"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px;">Delete</button>
    <a href="{% url 'dashboard' %}" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
